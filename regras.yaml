# ordem: 1 = mais fácil, 8 = só acompanhar

limiares:
  escalar_expirada_dias: 30   # depende de outros e expirada há mais que isso: "cobrar retorno e escalar"
  analise_atrasada_dias: 30
  antiga_dias: 180

faixas_facilidade:
  - {ate_ordem: 3, nome: "Rápida"}
  - {ate_ordem: 6, nome: "Trabalho da MEH"}
  - {ate_ordem: 99, nome: "Depende de outros"}

faixas_idade:
  - {ate_dias: 30, nome: "0–30 dias"}
  - {ate_dias: 90, nome: "31–90 dias"}
  - {ate_dias: 180, nome: "91–180 dias"}
  - {ate_dias: 999999, nome: "Mais de 180 dias"}

# não contam como duplicada
codigos_genericos: [TERM-0001, OUTROS-0001, MEH, ROUPA]

sem_pendencia:
  aberta:
    depende_de: "MEH"
    ordem: 5
    acao: "Triar e iniciar atendimento"
    acao_pedido_compra: "Dar andamento ao pedido de compra"
  pendente:    # sem motivo registrado
    depende_de: "MEH"
    ordem: 2
    acao: "Registrar o motivo da pendência"

# vale a primeira que bater
# se_expirada: muda ordem e ação quando o prazo da pendência expirou há mais de "dias" (0 = assim que expira)
pendencias:
  - contem: "FECHAR OS"
    depende_de: "MEH"
    ordem: 1
    acao: "Fechar a OS no sistema"

  - contem: "AGUARDANDO CERTIFICADO"
    depende_de: "Fornecedor / terceiros"
    ordem: 7
    acao: "Aguardar certificado"
    se_expirada: {dias: 0, ordem: 3, acao: "Cobrar certificado do fornecedor e fechar"}

  - contem: "SOLICITACAO DE TRANSPORTE"
    depende_de: "Fornecedor / terceiros"
    ordem: 8
    acao: "Aguardar transporte"

  - contem: "AGUARDANDO ANALISE DO EQUIPAMENTO"
    depende_de: "MEH"
    ordem: 6
    acao: "Analisar o equipamento"
    se_expirada: {dias: 0, ordem: 6, acao: "Analisar o equipamento (prazo expirado)"}
  - contem: "PROBLEMA MULTIFATORIAL"
    depende_de: "MEH"
    ordem: 7
    acao: "Conversar com a equipe"
    se_expirada: {dias: 0, ordem: 7, acao: "Marcar reunião (prazo expirado)"}

  # terceiros
  - {contem: "AGUARDANDO EXECUCAO DO SERVICO TERCEIROS", depende_de: "Fornecedor / terceiros", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO O.S. TERCEIROS",               depende_de: "Fornecedor / terceiros", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO RETORNO DO EQUIPAMENTO",       depende_de: "Fornecedor / terceiros", ordem: 8, acao: "Acompanhar"}

  - contem: "AGUARDANDO ENVIO DE DOCUMENTACAO"
    depende_de: "Fornecedor / terceiros"
    ordem: 8
    acao: "Acompanhar envio da documentação pelo fornecedor"
    se_expirada: {dias: 0, ordem: 3, acao: "Cobrar documentação do fornecedor"}

  # compras / financeiro
  - {contem: "AGUARDANDO APROVACAO DE ORCAMENTO", depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO ORCAMENTO",              depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO SETOR COMPRAS",          depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO SETOR FINANCEIRO",       depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO EMPENHO",                depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO ADIANTAMENTO",           depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO ENVIO DE NOTA FISCAL",   depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO PECA",                   depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}
  - {contem: "AGUARDANDO DEMANDA",                depende_de: "Suprimentos / financeiro", ordem: 8, acao: "Acompanhar"}

  - contem: "AGUARDANDO ALMOXARIFADO"
    depende_de: "Suprimentos / financeiro"
    ordem: 8
    acao: "Acompanhar entrega do almoxarifado"
    se_expirada: {dias: 0, ordem: 3, acao: "Cobrar entrega do almoxarifado"}

# aparece um aviso no painel
pendencia_desconhecida:
  depende_de: "Não classificado"
  ordem: 8
  acao: "Pendência sem regra: classificar em regras.yaml"
